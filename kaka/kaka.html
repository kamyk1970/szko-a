<html>

<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>Zmieniacz głośnośći dzwonka</h2>
  
  <form action="/process" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required><br><br>

    <label>
      <input id="norm" type="radio" name="mode" value="normalize" checked>
      Normalizuj głośność
    </label><br>

    <label>
      <input type="radio" name="mode" value="increase">
      Zwiększ głośność (%)
    </label><br><br>

    <input id="proc" type="number" step="0.1" name="percentage" placeholder="Procent (tylko dla opcji 2)"><br><br>

    <input id="but" type="submit" value="Przetwórz">
  </form>
</body>

</html>
