<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #back{
            width: 500px;
            height: 500px;
            background-color: lightblue;
            margin: 20%;
            display: flex;
            position: relative;
            position:absolute;
            justify-content: end;
        }
        .mult{
            margin-right: 10px;
            margin-top: 75px;
            width: 30px;
            height: 25px;
            background-color: lightcoral;
            align-content: center;
            text-align: center;
            position: relative;
            
        }
        #actm{
            align-self: end;
            margin-bottom: 10px;
            position: relative;
            position:absolute;

        }
        #but{
            width: 50px;
            height: 50px;
            align-self: anchor-center;
            position: relative;
        }
        #money{
            width:-webkit-fill-available;
        }
    </style>
</head>
<body>
    <main id="back">
        <aside id="money">$0</aside>
        <button id="but">Kliknij</button>
        <div id="actm">x1</div>
        <div>
            <aside class="mult" id="m2">x2</aside>
            <aside class="mult" id="m4">x4</aside>
            <aside class="mult" id="m8">x8</aside>
            <aside class="mult" id="m10">x10</aside>   
        </div>
    </main>
</body>
<script></script>
</html>
